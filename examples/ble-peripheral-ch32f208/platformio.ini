; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ch32f
framework = noneos-sdk
monitor_speed = 115200
; system clock of the EVT example: 96 MHz from the 32 MHz HSE
board_build.clock_source = hse+pll
board_build.f_cpu = 96000000L
; as the EVT: code up to 0x08070000, using the flash beyond the 128K zero wait
; area; the BLE library keeps the bonding information (SNV) at 0x08077C00
board_upload.maximum_size = 458752
; the BLE library (ARM Compiler 5) uses enums as small as possible; it is
; tagged with 2-byte wchar_t but has no wchar_t in its interface.
; Its highcode functions run from RAM, which makes the RAM segment RWX.
; wchble.h uses the ARM Compiler pragma anon_unions.
build_flags =
  -fshort-enums
  -Wl,--no-wchar-size-warning
  -Wl,--no-warn-rwx-segments
  -Wno-unknown-pragmas

[env:genericCH32F208WBU6]
board = genericCH32F208WBU6

[env:genericCH32F208RBT6]
board = genericCH32F208RBT6
